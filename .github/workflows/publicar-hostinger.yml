# Publicação do site na Hostinger
#
# Toda vez que a branch "main" recebe uma alteração, este robô:
#   1. confere o código (lint) e gera o site estático (pasta out/);
#   2. coloca junto a página /compreaqui/ (link na bio), copiada sem
#      mudanças do repositório público FranzeBrandao/Link-na-bio;
#   3. confere que está entrando na pasta certa da Hostinger (public_html);
#   4. envia o site por FTPS direto para public_html, só o que mudou.
#
# Por que FTPS e não a conexão Git da Hostinger: a implantação pelo Git
# APAGA tudo o que não está no repositório, inclusive a pasta
# public_html/catalogo, que é publicada por outro robô (repositório
# catalogo-bem-estar). Testado em 08/10/2026. Este robô nunca envia nem
# apaga nada dentro de catalogo/ e nunca apaga arquivos que ele mesmo
# não enviou.
#
# Precisa dos segredos FTP_SERVIDOR, FTP_USUARIO e FTP_SENHA de uma conta
# FTP cuja pasta seja public_html (NÃO a conta do catálogo). Sem eles, o
# site é gerado mas não é enviado.
#
# Também dá para rodar na mão: aba Actions → "Publicar na Hostinger" →
# Run workflow.

name: Publicar na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Se duas publicações começarem juntas, só a mais nova segue.
concurrency:
  group: publicar-hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
    steps:
      - name: Baixar o código do site
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir o código
        run: npm run lint

      - name: Gerar o site estático
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://farmaciabemestarsobral.com

      - name: Baixar a página do link na bio (/compreaqui/)
        uses: actions/checkout@v4
        with:
          repository: FranzeBrandao/Link-na-bio
          path: _link-na-bio

      - name: Colocar a /compreaqui/ dentro do site
        # Mesmos arquivos do pacote compreaqui.zip (ver README do Link-na-bio)
        run: |
          mkdir -p out/compreaqui
          cp -r _link-na-bio/index.html _link-na-bio/.htaccess _link-na-bio/favicon.png \
                _link-na-bio/assets _link-na-bio/images out/compreaqui/
          rm -f out/compreaqui/images/logo-farmacia-bem-estar.png
          test -f out/compreaqui/index.html
          test -f out/.htaccess
          # O site nunca pode levar uma pasta catalogo/ (ela é do outro robô)
          test ! -e out/catalogo

      # Trava de segurança: a pasta de entrada da conta FTP tem que ser a
      # public_html, onde existe a pasta "catalogo". Se for outra pasta
      # (por exemplo, a conta do catálogo por engano), o robô para antes de
      # enviar qualquer arquivo.
      - name: Conferir a pasta de destino na Hostinger
        if: env.FTP_SERVIDOR != ''
        env:
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_SENHA: ${{ secrets.FTP_SENHA }}
        run: |
          # -k: mesmo modo "loose" do envio abaixo (certificado da Hostinger
          # pode não bater com o nome do servidor)
          lista=$(curl -sS -k --ssl-reqd --list-only --user "$FTP_USUARIO:$FTP_SENHA" "ftp://$FTP_SERVIDOR/")
          echo "Pastas e arquivos na entrada da conta FTP:"
          echo "$lista"
          if ! printf '%s\n' "$lista" | tr -d '\r' | grep -qx "catalogo"; then
            echo "::error::A conta FTP não está apontando para public_html (não achei a pasta catalogo). Nada foi enviado. Confira a pasta da conta FTP do site no hPanel; se a pasta catalogo sumiu, rode antes o robô do catálogo."
            exit 1
          fi

      - name: Enviar o site para a Hostinger (FTPS)
        if: env.FTP_SERVIDOR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          # Nunca apagar tudo antes de enviar
          dangerous-clean-slate: false
          # catalogo/ é do outro robô: nunca enviar nem apagar nada lá
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            catalogo/**
