<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Farmácia Bem Estar">
  <title>Farmácia Bem Estar</title>

  <!-- Reconstrução vetorial aproximada da fachada real da farmácia
       (cruz branca sobre painel vermelho + "FARMÁCIA" branco sobre azul +
       "Bem Estar" vermelho sobre branco). Provisória até o arquivo
       original (PNG/SVG/AI) ser recebido. -->

  <rect x="0" y="0" width="800" height="260" fill="#153FC7"/>
  <rect x="0" y="0" width="210" height="260" fill="#D71920"/>

  <!-- Cruz branca -->
  <rect x="65" y="30" width="80" height="200" rx="14" fill="#FFFFFF"/>
  <rect x="20" y="75" width="170" height="110" rx="14" fill="#FFFFFF"/>

  <text
    x="505"
    y="100"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="58"
    letter-spacing="4"
    fill="#FFFFFF"
  >FARMÁCIA</text>

  <rect x="230" y="130" width="550" height="100" fill="#FFFFFF"/>

  <text
    x="505"
    y="200"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-style="italic"
    font-size="64"
    fill="#E2141E"
  >Bem Estar</text>
</svg>
